
name: NSE research scan (paper only)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner dependency
        run: python -m pip install 'yfinance>=0.2.50,<2'
      - name: Generate daily research snapshot
        run: python scanner.py
      - name: Commit scan JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily_signals.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily paper research scan'
            git push
          fi
